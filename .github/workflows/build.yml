name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32 firmware (CYD 2432S028R)
        run: |
          # GH Actions 会覆盖容器 entrypoint，idf 环境需手动激活；并修复容器内 git 属主告警
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          cd src/ports/esp32
          idf.py build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bins
          path: |
            src/ports/esp32/build/bootloader/bootloader.bin
            src/ports/esp32/build/partition_table/partition-table.bin
            src/ports/esp32/build/klipper_remote_display.bin

  package:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-bins
          path: dist

      - name: Flatten artifact layout
        # upload-artifact 保留目录层级，下载后需拍平成刷机脚本期望的平铺结构
        run: |
          mv dist/bootloader/bootloader.bin dist/
          mv dist/partition_table/partition-table.bin dist/
          rmdir dist/bootloader dist/partition_table
          ls -la dist

      - name: Download esptool (Windows standalone)
        run: |
          TAG=$(curl -s https://api.github.com/repos/espressif/esptool/releases/latest | jq -r .tag_name)
          echo "esptool $TAG"
          curl -L -o /tmp/esptool.zip "https://github.com/espressif/esptool/releases/download/${TAG}/esptool-${TAG}-windows-amd64.zip"
          unzip -o /tmp/esptool.zip -d /tmp/esptool
          find /tmp/esptool -name esptool.exe -exec cp {} dist/ \;

      - name: Add flash scripts
        run: |
          cp tools/release/flash.bat tools/release/flash.sh dist/
          chmod +x dist/flash.sh

      # 直接把 dist 内容作为 artifact：GitHub 下载时会打一层 zip，
      # 解压后即是平铺的刷机文件，不再出现"zip 套 zip"
      - uses: actions/upload-artifact@v4
        with:
          name: klipper-remote-esp32-${{ github.ref_name }}
          path: dist/

  desktop-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            zip

      - name: Build Windows desktop (SDL2)
        shell: msys2 {0}
        run: |
          export PATH=/ucrt64/bin:$PATH
          cd src/ports/desktop
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp /ucrt64/bin/SDL2.dll build/

      - name: Package desktop exe
        shell: msys2 {0}
        run: |
          mkdir -p dist-win
          cp src/ports/desktop/build/klipper_remote_desktop.exe src/ports/desktop/build/SDL2.dll dist-win/
          ls -la dist-win

      - uses: actions/upload-artifact@v4
        with:
          name: klipper-remote-desktop-win-x86_64-${{ github.ref_name }}
          path: dist-win/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Zip artifacts for release
        run: |
          (cd dl/klipper-remote-esp32-* && zip -r "$GITHUB_WORKSPACE/klipper-remote-esp32-${GITHUB_REF_NAME}.zip" .)
          (cd dl/klipper-remote-desktop-win-x86_64-* && zip -r "$GITHUB_WORKSPACE/klipper-remote-desktop-win-x86_64-${GITHUB_REF_NAME}.zip" .)
          ls -la "$GITHUB_WORKSPACE"/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            klipper-remote-esp32-*.zip
            klipper-remote-desktop-win-x86_64-*.zip
          generate_release_notes: true
